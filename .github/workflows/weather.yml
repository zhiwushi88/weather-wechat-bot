name: weather-bot

# 目标：北京时间 07:30 收到提醒。
# GitHub 免费版 schedule 实测稳定迟到约 4 小时 05 分（11-03~11-06 实测 3h37m~4h28m），
# 故 cron 提前 4 小时 05 分补偿：UTC 19:25 = 北京 03:25，加上延迟落在 07:30 前后。
# 注意：延迟量不是常数。若哪天变准点，邮件会在凌晨 03:25 发出。长期方案见 HANDOVER.md。
on:
  schedule:
    - cron: "25 19 * * *"
  workflow_dispatch:

concurrency:
  group: weather-bot
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check weather and notify
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
          MIN_SOURCES: "2"
          RAIN_PROB_THRESHOLD: "50"
        run: node bot.mjs
