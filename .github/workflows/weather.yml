name: weather-bot

# 每天北京时间 07:30 运行一次（UTC 23:30）
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

concurrency:
  group: weather-bot
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check weather and notify
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
          MIN_SOURCES: "2"
          RAIN_PROB_THRESHOLD: "50"
        run: node bot.mjs
